[tool.poetry]
name = "ganho-capital"
version = "0.1.0"
description = "Projeto com o objetivo de implementar um programa de linha de comando que calcula o imposto a ser pago sobre lucros ou prejuizos de operacoes no mercado financeiro de acoes"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.8.1"
pytest = "^7.3.1"
coverage = "^7.2.5"
black = "^23.3.0"
flake8 = "^6.0.0"
mypy = "^1.3.0"
isort = "^5.12.0"
autoflake = "^2.1.1"
pylint = "^2.17.4"
pydantic = "^1.10.7"
pre-commit = "^3.3.1"

[tool.isort]
profile = "black"
multi_line_output = 3
src_paths = ["system",]

[tool.coverage.run]
branch = true
include = [
    "system/adapter_entrypoints/cli*",
    "system/application/usecase/*",
    "system/application/dto/*",
    "system/domain/entities/*",
    "system/domain/value_objects/*",
]
omit = ["*__.py", "system/application/usecases/usecase.py"]
[tool.coverage.report]
fail_under = 80
sort = "-Cover"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
